openapi: 3.0.3
info:
  title: DocScanner API
  version: 2.0.0
  description: |
    AI-assisted Document Parser untuk PT. UNIAIR INDOTAMA CARGO.

    ## Alur Penggunaan
    | Step | Endpoint | Keterangan |
    |------|----------|------------|
    | 1 | `POST /auth/login` | Login → dapat `accessToken` |
    | 2 | `POST /source-files` | Upload PDF |
    | 3 | `GET /source-files/{id}` | Polling sampai status `completed` |
    | 4 | `GET /documents?source_file_id={id}` | Ambil daftar dokumen hasil parsing |
    | 5 | `GET /documents/{id}` | Lihat detail field & items |

    ## Status Source File
    | Status | Keterangan |
    |--------|------------|
    | `uploaded` | File baru masuk |
    | `processing` | Sedang diproses worker |
    | `completed` | Selesai |
    | `failed` | Gagal, bisa di-retry |
    | `pending_review` | Confidence AI rendah, perlu review manual |

    ## Autentikasi
    Semua endpoint kecuali `/auth/login` membutuhkan Bearer token di header:
    ```
    Authorization: Bearer <accessToken>
    ```

servers:
  - url: http://localhost:3000/api
    description: Local Development

tags:
  - name: Auth
    description: Autentikasi user
  - name: Users
    description: Manajemen user (admin only)
  - name: Source Files
    description: Upload dan manajemen file PDF
  - name: Documents
    description: Hasil parsing dokumen
  - name: Jobs
    description: Extraction job per dokumen

# ── Security ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Reusable Schemas ──────────────────────────────────────────────────
  schemas:
    # ── Generic Response ──────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Berhasil

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: fail
        message:
          type: string
          example: Pesan error

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 25
        total_pages:
          type: integer
          example: 3

    # ── User ──────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 38aeb736-006a-49d4-978d-5067541f189d
        name:
          type: string
          example: Administrator
        email:
          type: string
          format: email
          example: admin@example.com
        role:
          type: string
          enum: [admin, operator]
          example: admin
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Auth ──────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: Admin@12345

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Login berhasil
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              $ref: "#/components/schemas/User"

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ── Source File ───────────────────────────────────────────────────
    SourceFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 892a777e-0686-45fc-a61f-3c7044c85251
        file_name:
          type: string
          example: 380 - Invoice 1.pdf
        file_path:
          type: string
          example: uploads/temp/abc123.pdf
        mime_type:
          type: string
          example: application/pdf
        page_count:
          type: integer
          example: 5
        status:
          type: string
          enum: [uploaded, processing, completed, failed, pending_review]
          example: completed
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
        error_message:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        uploaded_by:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/User"

    # ── Document Type ─────────────────────────────────────────────────
    DocumentType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "380"
        name:
          type: string
          example: Invoice

    # ── Vendor ────────────────────────────────────────────────────────
    Vendor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: PT. BYD AUTO INDONESIA

    # ── Field ─────────────────────────────────────────────────────────
    Field:
      type: object
      properties:
        key:
          type: string
          example: invoice_number
        value:
          type: string
          nullable: true
          example: INV-2024-001

    # ── Item Column ───────────────────────────────────────────────────
    ItemColumn:
      type: object
      properties:
        key:
          type: string
          example: description
        value:
          type: string
          nullable: true
          example: Spare Part A

    # ── Item ──────────────────────────────────────────────────────────
    Item:
      type: object
      properties:
        row_index:
          type: integer
          example: 1
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ItemColumn"

    # ── Document ──────────────────────────────────────────────────────
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 193c24e2-123c-4430-b320-ed2f4e1890a1
        job_id:
          type: string
          format: uuid
          nullable: true
        start_page:
          type: integer
          example: 1
        end_page:
          type: integer
          example: 3
        status:
          type: string
          enum: [queued, extracting, completed, failed, pending_review]
          example: completed
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        needs_review:
          type: boolean
          example: false
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        document_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DocumentType"
        vendor:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Vendor"
        source_file:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SourceFile"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    # ── Job ───────────────────────────────────────────────────────────
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
          example: completed
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
        attempt:
          type: integer
          example: 1
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        document:
          nullable: true
          type: object
          properties:
            id:
              type: string
              format: uuid
            start_page:
              type: integer
            end_page:
              type: integer
            status:
              type: string
            document_type:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/DocumentType"
            source_file:
              nullable: true
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                file_name:
                  type: string

# ── Security default (semua endpoint butuh auth kecuali yang override) ────
security:
  - BearerAuth: []

# ── Paths ─────────────────────────────────────────────────────────────────
paths:
  # ════════════════════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      description: Authenticate user dan dapatkan access token + refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: admin@example.com
              password: Admin@12345
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: fail
                message: Email atau password salah
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    put:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Gunakan refresh token untuk mendapatkan access token baru.
        Access token expired setiap 15 menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Access token berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Access token diperbarui
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Refresh token tidak valid atau tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    delete:
      tags: [Auth]
      summary: Logout user
      description: Hapus refresh token dari database sehingga tidak bisa digunakan lagi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                message: Logout berhasil
        "400":
          description: Refresh token tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════
  # USERS
  # ════════════════════════════════════════════════════════════
  /users:
    get:
      tags: [Users]
      summary: List semua user
      description: Mengambil daftar semua user. Hanya dapat diakses oleh admin.
      responses:
        "200":
          description: Daftar user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil daftar user
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — bukan admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Users]
      summary: Buat user baru
      description: |
        Membuat user baru (admin atau operator).
        Hanya dapat dilakukan oleh admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                  example: Operator Baru
                email:
                  type: string
                  format: email
                  example: operator@example.com
                password:
                  type: string
                  minLength: 8
                  example: password123
                role:
                  type: string
                  enum: [admin, operator]
                  example: operator
      responses:
        "201":
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User berhasil dibuat
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validasi gagal atau email sudah digunakan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — bukan admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      tags: [Users]
      summary: Detail user
      description: Mengambil detail satu user berdasarkan ID. Hanya admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 38aeb736-006a-49d4-978d-5067541f189d
      responses:
        "200":
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil detail user
                  data:
                    $ref: "#/components/schemas/User"
        "404":
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Users]
      summary: Update user
      description: |
        Update data user. Minimal satu field harus diisi.
        Hanya admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Nama Baru
                email:
                  type: string
                  format: email
                  example: newemail@example.com
                role:
                  type: string
                  enum: [admin, operator]
                  example: operator
      responses:
        "200":
          description: User berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Users]
      summary: Hapus user
      description: |
        Menghapus user. Hanya admin.
        Admin tidak dapat menghapus akunnya sendiri.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Tidak dapat menghapus akun sendiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════
  # SOURCE FILES
  # ════════════════════════════════════════════════════════════
  /source-files:
    post:
      tags: [Source Files]
      summary: Upload PDF
      description: |
        Upload file PDF untuk diproses sistem.
        Setelah upload, file akan dimasukkan ke antrian worker untuk:
        1. **Phase 1** — Cheap AI mendeteksi batas dokumen
        2. **Phase 2** — Smart AI mengekstrak data per dokumen

        Gunakan `GET /source-files/{id}` untuk memantau status pemrosesan.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File PDF (maks 100MB)
                pages:
                  type: string
                  description: |
                    Opsional — range halaman yang ingin diproses.
                    Format: `1-5` atau `1,3,5` atau `1-3,7`
                  example: "1-5"
      responses:
        "200":
          description: File berhasil diupload dan dimasukkan ke antrian
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: File berhasil diupload
                  data:
                    $ref: "#/components/schemas/SourceFile"
        "400":
          description: File tidak dikirim atau tipe file tidak didukung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Source Files]
      summary: List source files
      description: Mengambil daftar file yang telah diupload dengan pagination dan filter status.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          example: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [uploaded, processing, completed, failed, pending_review]
          example: completed
      responses:
        "200":
          description: Daftar file berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil daftar file
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SourceFile"
                      pagination:
                        $ref: "#/components/schemas/Pagination"

  /source-files/{id}:
    get:
      tags: [Source Files]
      summary: Detail source file
      description: |
        Mengambil detail satu file berdasarkan ID.
        Gunakan endpoint ini untuk **polling status** pemrosesan.

        Flow status: `uploaded` → `processing` → `completed` / `failed` / `pending_review`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 892a777e-0686-45fc-a61f-3c7044c85251
      responses:
        "200":
          description: Detail file berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil detail file
                  data:
                    $ref: "#/components/schemas/SourceFile"
        "404":
          description: File tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /source-files/{id}/retry:
    post:
      tags: [Source Files]
      summary: Retry pemrosesan file
      description: |
        Ulangi pemrosesan file dari awal (Phase 1 + Phase 2).
        Hanya bisa dilakukan pada file dengan status `failed` atau `pending_review`.

        Dokumen lama akan dihapus dan dibuat ulang dari hasil boundary detection baru.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Retry berhasil dimasukkan ke antrian
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Retry berhasil dimasukkan ke antrian
                  data:
                    $ref: "#/components/schemas/SourceFile"
        "400":
          description: File tidak dalam status failed atau pending_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: fail
                message: "Hanya file 'failed' atau 'pending_review' yang bisa di-retry"
        "404":
          description: File tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════
  # DOCUMENTS
  # ════════════════════════════════════════════════════════════
  /documents:
    get:
      tags: [Documents]
      summary: List dokumen hasil parsing
      description: |
        Mengambil daftar dokumen logis hasil parsing PDF.
        Satu source file dapat menghasilkan banyak dokumen (sesuai boundary detection).
        Filter dengan `source_file_id` untuk melihat dokumen dari file tertentu.
      parameters:
        - name: source_file_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter berdasarkan source file ID
          example: 892a777e-0686-45fc-a61f-3c7044c85251
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Daftar dokumen berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil daftar dokumen
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Document"
                      pagination:
                        $ref: "#/components/schemas/Pagination"

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Detail dokumen
      description: |
        Mengambil detail lengkap satu dokumen termasuk:
        - `fields` — header key-value hasil ekstraksi
        - `items` — baris tabel dengan kolom dinamis per vendor

        Contoh `fields` untuk Invoice (380):
        ```json
        [
          { "key": "invoice_number", "value": "INV-2024-001" },
          { "key": "seller_name",    "value": "BYD (H.K.) CO., LIMITED" },
          { "key": "total",          "value": "1928916" }
        ]
        ```

        Contoh `items` untuk detail unit kendaraan:
        ```json
        [
          {
            "row_index": 1,
            "columns": [
              { "key": "brand",    "value": "BYD" },
              { "key": "model",    "value": "ME-8 (4X2) A/T" },
              { "key": "vin",      "value": "LC0CE4CB7S0127596" },
              { "key": "motor_no", "value": "TZ200XSQ 4D5002628" }
            ]
          }
        ]
        ```
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 193c24e2-123c-4430-b320-ed2f4e1890a1
      responses:
        "200":
          description: Detail dokumen berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil detail dokumen
                  data:
                    $ref: "#/components/schemas/Document"
        "404":
          description: Dokumen tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════
  # JOBS
  # ════════════════════════════════════════════════════════════
  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Detail extraction job
      description: |
        Mengambil detail job ekstraksi untuk satu dokumen.
        Setiap dokumen memiliki satu job yang melacak progress ekstraksi.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail job berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Berhasil mengambil detail job
                  data:
                    $ref: "#/components/schemas/Job"
        "404":
          description: Job tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}/retry:
    post:
      tags: [Jobs]
      summary: Retry extraction job
      description: |
        Ulangi ekstraksi untuk satu dokumen yang gagal.
        Berbeda dengan retry source file — ini hanya mengulang **satu dokumen** saja,
        bukan seluruh PDF.

        Hanya bisa dilakukan pada job dengan status `failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Retry job berhasil dimasukkan ke antrian
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Retry job berhasil dimasukkan ke antrian
                  data:
                    $ref: "#/components/schemas/Job"
        "400":
          description: Job tidak dalam status failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: fail
                message: "Hanya job 'failed' yang bisa di-retry"
        "404":
          description: Job tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
